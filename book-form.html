<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Add/Edit Book | LibraryDesk</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="book-form"><nav class="navbar navbar-dark app-navbar"><div class="container"><a class="navbar-brand fw-bold" href="index.html">📚 LibraryDesk</a><a class="nav-link text-white" href="books.html">← Back to books</a></div></nav>
<main class="container py-5 form-container"><div class="section-heading"><div><p class="eyebrow">COLLECTION</p><h1 id="formTitle">Add a book</h1><p>Fill in the book details below.</p></div></div><div id="notice"></div>
<form id="bookForm" class="panel form-panel"><input type="hidden" id="bookId"><div class="row g-3">
<div class="col-md-6"><label class="form-label" for="title">Book title *</label><input class="form-control" id="title" required maxlength="120"></div>
<div class="col-md-6"><label class="form-label" for="author">Author *</label><input class="form-control" id="author" required maxlength="100"></div>
<div class="col-md-6"><label class="form-label" for="category">Category *</label><select class="form-select" id="category" required><option value="">Choose category</option><option>Fiction</option><option>Science</option><option>Technology</option><option>History</option><option>Education</option><option>Other</option></select></div>
<div class="col-md-6"><label class="form-label" for="qty">Quantity *</label><input class="form-control" id="qty" type="number" min="1" required value="1"></div></div>
<div class="d-flex gap-2 mt-4"><button class="btn btn-primary" type="submit">Save book</button><a class="btn btn-light" href="books.html">Cancel</a></div></form></main>
<script src="js/app.js"></script></body></html>

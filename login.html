<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | LibraryDesk</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="login" class="login-page">
<nav class="navbar navbar-dark app-navbar"><div class="container"><a class="navbar-brand fw-bold" href="index.html">📚 LibraryDesk</a><a class="nav-link text-white" href="index.html">Back to home</a></div></nav>
<main class="container login-wrap"><div class="login-card"><div class="text-center mb-4"><div class="login-mark">📚</div><h1 class="h3 fw-bold">Welcome back</h1><p class="text-secondary">Sign in to your library account</p></div>
<div id="notice"></div><form id="loginForm"><div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" id="email" type="email" placeholder="admin@example.com" required></div>
<div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password" placeholder="Enter any password" required></div>
<button class="btn btn-primary w-100" type="submit">Sign in</button></form><p class="small text-secondary mt-3 mb-0">Demo only: enter any valid email and password. This does not provide real server authentication.</p></div></main>
<script src="js/app.js"></script></body></html>
